# Nginx 配置 - 子路径部署（例如 http://domain.com/game/）

server {
    listen 80;
    server_name 113.44.233.34;  # 修改为你的域名或IP

    # /game 子路径部署
    location /game/ {
        alias /path/to/UnityHuntingGame/threejs-version/;
        index index.html;
        try_files $uri $uri/ /game/index.html;
    }

    # Socket.io 代理 - 子路径版本
    location /game/socket.io/ {
        # 重写路径：去掉 /game 前缀
        rewrite ^/game/socket.io/(.*)$ /socket.io/$1 break;

        proxy_pass http://127.0.0.1:8090;

        # WebSocket 支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 转发真实客户端信息
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 禁用缓冲
        proxy_buffering off;
    }
}
